    whatsapp: ['Choisis le contact — ton texte est déjà dans la barre.', `Fais <kbd>${PASTE_KEY}</kbd> dans la conversation : la photo s'ouvre avec ton texte en légende.`, 'Envoie. Un seul message, image en haut.'],
    instagram: ['Le portrait a été téléchargé sur ton ordinateur.', 'Ouvre le DM et joins-le comme une photo normale.', `Fais <kbd>${PASTE_KEY}</kbd> pour le texte, en légende. Envoie.`],
  },
  es: {
    title: 'Casi enviado — un último paso',
    close: 'Entendido',
    recopy: 'Copiar la imagen de nuevo',
    mail: ['Tu mensaje ya está escrito en el borrador.', `Haz clic en el cuerpo del correo y pulsa <kbd>${PASTE_KEY}</kbd> — el retrato queda encima del texto.`, 'Envía.'],
    whatsapp: ['Elige el contacto — tu texto ya está en la barra.', `Pulsa <kbd>${PASTE_KEY}</kbd> en el chat: la foto se abre con tu texto como pie.`, 'Envía. Un solo mensaje, imagen arriba.'],
    instagram: ['El retrato se descargó en tu computador.', 'Abre el DM y adjúntalo como cualquier foto.', `Pulsa <kbd>${PASTE_KEY}</kbd> para el texto, como pie. Envía.`],
  },
};

let lang = 'en';
let replyIndex = 0;

function t() { return I18N[lang]; }
function ui() { return UI[lang]; }

/* No URL inside the text: a raw link is ugly and previews badly. The portrait
   travels as a real image — clipboard on desktop, attached file on mobile. */
function fullMessage() { return t().message; }

function render() {
  document.documentElement.lang = lang;
  document.getElementById('t-subtitle').textContent = t().subtitle;
  document.getElementById('t-chat-title').textContent = t().chatTitle;
  document.getElementById('t-msg-title').textContent = t().msgTitle;
  document.getElementById('chat-input').placeholder = t().placeholder;
  document.getElementById('t-copy').textContent = t().copy;
  document.getElementById('message').textContent = fullMessage();
  document.getElementById('legal').textContent = t().legal;
  document.getElementById('t-visual-caption').textContent = VISUAL_CAPTION[lang];
  document.getElementById('t-share-native').textContent = ui().native;
  document.getElementById('t-copy-image').textContent = ui().copyImg;
  document.getElementById('t-download').textContent = ui().download;
  document.getElementById('t-hint').textContent = ui().hint;
  document.querySelectorAll('.langs button').forEach((b) =>
    b.classList.toggle('active', b.dataset.lang === lang));
  document.getElementById('share-note').textContent = '';
  resetChat();
}

function resetChat() {
  const log = document.getElementById('chat-log');
  log.innerHTML = '';
  addMsg('agent', t().greeting);
  replyIndex = 0;
}

function addMsg(who, text) {
  const el = document.createElement('div');
  el.className = `msg ${who}`;
  el.textContent = text;
  document.getElementById('chat-log').appendChild(el);
  el.scrollIntoView({ block: 'nearest' });
}

function ask() {
  const input = document.getElementById('chat-input');
  const q = input.value.trim();
  if (!q) return;
  addMsg('user', q);
  input.value = '';
  const reply = t().replies[replyIndex % t().replies.length];
  replyIndex++;
  setTimeout(() => addMsg('agent', reply), 550);
}

document.getElementById('chat-send').addEventListener('click', ask);
document.getElementById('chat-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') ask();
});

document.querySelectorAll('.langs button').forEach((b) =>
  b.addEventListener('click', () => { lang = b.dataset.lang; render(); }));

/* ---------- visual ---------- */
const visualImg = document.getElementById('visual-img');
visualImg.addEventListener('click', () => window.open(VISUAL, '_blank'));

// Prefer the local copy (same-origin = clipboard and share sheet work).
(function resolveVisual() {
  const probe = new Image();
  probe.onload = () => { VISUAL = VISUAL_LOCAL; visualImg.src = VISUAL; };
  probe.onerror = () => {
    VISUAL = VISUAL_CDN;
    visualImg.src = VISUAL;
    visualImg.onerror = () => { document.getElementById('visual-wrap').style.display = 'none'; };
  };
  probe.src = VISUAL_LOCAL;
})();

/* ---------- share ---------- */
function body() { return encodeURIComponent(fullMessage()); }
function subject() { return encodeURIComponent(t().subject); }

async function copyMessage() {
  try {
    await navigator.clipboard.writeText(fullMessage());
    return true;
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = fullMessage();
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    return true;
  }
}

/* ---------- the image itself ---------- */
/* Fetching the PNG needs CORS, which file:// blocks. Served over http
   (npm start / GitHub Pages) everything below works; opened as a local
   file we degrade to "open the image so you can copy it by hand". */
let imageBlobPromise = null;
function getImageBlob() {
  if (!imageBlobPromise) {
    imageBlobPromise = fetch(VISUAL, { mode: 'cors' }).then((r) => {
      if (!r.ok) throw new Error('fetch failed');
      return r.blob();
    });
  }
  return imageBlobPromise;
}

function note(text) {
  document.getElementById('share-note').textContent = text;
}

async function copyImageToClipboard() {
  try {
    // Promise form keeps Safari's user-gesture requirement happy.
    const png = getImageBlob().then((b) =>
      b.type === 'image/png' ? b : new Blob([b], { type: 'image/png' }));
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': png })]);
    note(ui().imgCopied);
    return true;
  } catch (e) {
    window.open(VISUAL, '_blank'); // manual path, always available
    note(ui().imgFailed);
    return false;
  }
}

async function downloadImage() {
  const a = document.createElement('a');
  a.download = 'agent-hermes-bag.png';
  try {
    const blob = await getImageBlob();
    a.href = URL.createObjectURL(blob);
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    note(ui().downloaded);
  } catch (e) {
    window.open(VISUAL, '_blank');
    note(ui().imgFailed);
  }
}

/* Native share: the only path that truly attaches the file — one tap sends
   image + text together into WhatsApp / Instagram / Mail. */
async function nativeShare() {
  const data = { title: t().subject, text: fullMessage() };
  try {
    const blob = await getImageBlob();
    const file = new File([blob], 'agent-hermes-bag.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) data.files = [file];
  } catch (e) {
    // no file: the link-first text still previews as an image card
  }
  try {
    await navigator.share(data);
  } catch (e) {
    // user cancelled — nothing to do
  }
}

document.getElementById('copy-image').addEventListener('click', copyImageToClipboard);
document.getElementById('download-image').addEventListener('click', downloadImage);

if (navigator.share) {
  const btn = document.getElementById('share-native');
  btn.hidden = false;
  btn.addEventListener('click', nativeShare);
  // Where the OS can attach the file, that IS the way to send: lead with it.
  if (CAN_ATTACH) {
    document.querySelector('.share-row').prepend(btn);
    document.body.classList.add('can-attach');
  }
}

/* ---------- the desktop guide ---------- */
function showGuide(channel) {
  const g = GUIDE[lang];
  document.getElementById('guide-title').textContent = g.title;
  document.getElementById('guide-steps').innerHTML =
    g[channel].map((s) => `<li>${s}</li>`).join('');
  document.getElementById('guide-recopy').textContent = g.recopy;
  document.getElementById('guide-close').textContent = g.close;
  document.getElementById('guide').hidden = false;
}

document.getElementById('guide-close').addEventListener('click', () => {
  document.getElementById('guide').hidden = true;
});
document.getElementById('guide-recopy').addEventListener('click', copyImageToClipboard);
document.getElementById('guide').addEventListener('click', (e) => {
  if (e.target.id === 'guide') document.getElementById('guide').hidden = true;
});

/* Mail compose links carry plain text only — no attachment is possible.
   So we prefill the text AND put the image on the clipboard: one ⌘V in the
   body and the portrait sits above the message, like a real illustrated mail. */
document.getElementById('share-gmail').addEventListener('click', async () => {
  const ok = await copyImageToClipboard();
  window.open(`https://mail.google.com/mail/?view=cm&fs=1&su=${subject()}&body=${body()}`, '_blank');
  if (ok) showGuide('mail');
});

document.getElementById('share-outlook').addEventListener('click', async () => {
  const ok = await copyImageToClipboard();
  window.open(`https://outlook.live.com/mail/0/deeplink/compose?subject=${subject()}&body=${body()}`, '_blank');
  if (ok) showGuide('mail');
});

/* WhatsApp: text prefilled + image on the clipboard. Pasting it in the chat
   opens the photo composer with the text already as its caption — one
   message, image on top, exactly like sending a photo. */
document.getElementById('share-whatsapp').addEventListener('click', async () => {
  const ok = await copyImageToClipboard();
  window.open(`https://wa.me/?text=${body()}`, '_blank');
  if (ok) showGuide('whatsapp');
});

/* Instagram prefills nothing: hand over the image file + the text. */
document.getElementById('share-instagram').addEventListener('click', async () => {
  await copyMessage();
  await downloadImage();
  window.open('https://www.instagram.com/direct/inbox/', '_blank');
  showGuide('instagram');
});

document.getElementById('share-copy').addEventListener('click', async () => {
  await copyMessage();
  document.getElementById('share-note').textContent = t().copied;
});

render();
</script>
</body>
</html>
